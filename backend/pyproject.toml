[project]
name = "ai-workmate-backend"
version = "0.1.0"
description = "AI Workmate Backend - Phase 1 MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "alembic==1.14.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "msal==1.31.0",
    "msgraph-sdk==1.0.0",
    "ollama==0.4.2",
    "qdrant-client==1.12.0",
    "apscheduler==3.10.4",
    "blinker==1.8.2",
    "loguru==0.7.2",
    "structlog==25.1.0",
    "cryptography==43.0.3",
    "keyring==25.4.1",
    "python-multipart==0.0.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "email-validator==2.2.0",
    "tenacity==8.5.0",
    "openpyxl==3.1.5",
    "python-graphql-client==0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "faker==33.1.0",
    "ruff==0.7.3",
    "mypy==1.13.0",
    "pyinstaller==6.11.1",
]

[tool.setuptools]
packages = ["app", "alembic"]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "faker==33.1.0",
    "ruff==0.7.3",
    "mypy==1.13.0",
    "pyinstaller==6.11.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "T20", "SIM", "PIE", "PL", "TRY"]
ignore = ["S101", "TRY003"]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"