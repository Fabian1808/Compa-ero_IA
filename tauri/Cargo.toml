[package]
name = "ai-workmate"
version = "0.1.0"
description = "AI Workmate - Digital Work Companion"
authors = ["AI Workmate Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [
  "shell-sidecar",
  "fs-all",
  "path-all",
  "process-all",
  "notification-all",
  "window-all",
  "clipboard-manager",
  "dialog-all",
  "global-shortcut",
  "updater",
  "tray-all",
  "clipboard-all",
  "dialog-all",
  "fs-all",
  "http-all",
  "path-all",
  "process-all",
  "shell-all",
  "window-all",
] }
tauri-plugin-shell = { version = "2.0.0", features = ["sidecar"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-process = "2.0.0"
tauri-plugin-window = "2.0.0"
tauri-plugin-clipboard-manager = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-tray = "2.0.0"
tauri-plugin-clipboard = "2.0.0"
tauri-plugin-http = "2.0.0"
tauri-plugin-power = "2.0.0"
tauri-plugin-autostart = "2.0.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
members = []